  if (platform === "spotify") return "https://open.spotify.com/search/" + ara(s);
  if (platform === "youtubeMuzik") return "https://music.youtube.com/search?q=" + ara(s);
  return "https://www.youtube.com/results?search_query=" + ara(s);
}

/* ---------------- Ziyaret takibi ---------------- */
const Ziyaret = (() => {
  const ben = (() => {
    const q = new URLSearchParams(location.search).get("ben");
    try {
      if (q === "1") localStorage.setItem("hasanca-ben", "1");
      if (q === "0") localStorage.removeItem("hasanca-ben");
      return localStorage.getItem("hasanca-ben") === "1";
    } catch (e) { return false; }
  })();
  const giris = Date.now();
  const dinlenen = {};          // şarkı adı → saniye
  const gidilen = [];           // "Spotify (Gaddar)"
  let ozetSayisi = 0, sonOzet = "";

  let ziyaretNo = 1;
  try { ziyaretNo = Number(localStorage.getItem("hasanca-ziyaret") || 0) + 1; localStorage.setItem("hasanca-ziyaret", ziyaretNo); } catch (e) {}

  const params = new URLSearchParams(location.search);
  const kaynak = (() => {
    const utm = params.get("utm_source") || params.get("ref") || params.get("k");
    const ADLAR = { tiktok: "TikTok", instagram: "Instagram", ig: "Instagram", youtube: "YouTube", yt: "YouTube",
      spotify: "Spotify", whatsapp: "WhatsApp", facebook: "Facebook", fb: "Facebook" };
    if (utm) return ADLAR[utm.toLowerCase()] || utm;
    const r = document.referrer;
    if (!r) return "Doğrudan / uygulama içi tarayıcı";
    try { const h = new URL(r).hostname.replace(/^www\./, ""); return h === location.hostname ? "Site içi" : h; } catch (e) { return r; }
  })();
  const saatDilimi = (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (e) { return ""; } })();
  const ULKE = { Istanbul: "Türkiye", Stockholm: "İsveç", Berlin: "Almanya", Vienna: "Avusturya", Amsterdam: "Hollanda",
    Brussels: "Belçika", Paris: "Fransa", Zurich: "İsviçre", London: "Birleşik Krallık", Copenhagen: "Danimarka", Oslo: "Norveç",
    Helsinki: "Finlandiya", Nicosia: "Kıbrıs", Famagusta: "Kıbrıs", Baku: "Azerbaycan", Sofia: "Bulgaristan", Athens: "Yunanistan",
    Rome: "İtalya", Madrid: "İspanya", Warsaw: "Polonya", Prague: "Çekya", Budapest: "Macaristan", Bucharest: "Romanya",
    Moscow: "Rusya", Kiev: "Ukrayna", Kyiv: "Ukrayna", Tbilisi: "Gürcistan", Dubai: "BAE", Riyadh: "Suudi Arabistan",
    New_York: "ABD", Chicago: "ABD", Denver: "ABD", Los_Angeles: "ABD", Toronto: "Kanada", Sydney: "Avustralya" };
  const ulke = (() => { const sehir = saatDilimi.split("/").pop(); return (ULKE[sehir] || "") + (saatDilimi ? " (" + saatDilimi + ")" : ""); })();

  /* IP adresine göre yaklaşık konum (şehir, ülke). IP saklanmaz, e-postaya yazılmaz.
     Ziyaretçi VPN kullanıyorsa VPN'in konumu görünür. */
  let konumIp = "", robot = !!navigator.webdriver;
  /* Bağlantı kontrol robotları veri merkezlerinden gelir (Meta, ByteDance, Amazon, Google...).
     Cloudflare / Akamai / Fastly bilerek yok: iPhone'larda iCloud Özel Geçiş gerçek kişileri onlardan geçirir. */
  const ROBOT_KURUM = /facebook|meta platforms|bytedance|tiktok|amazon|aws|google llc|google cloud|microsoft|azure|digitalocean|ovh|hetzner|linode|akamai connected cloud|oracle|alibaba|tencent|choopa|vultr|leaseweb|scaleway|contabo|datacamp|m247/i;
  const konumHazir = (async () => {
    if (ben || !AYAR.bildirimAdresi) return "";
    const zamanAsimi = (ms) => new Promise((r) => setTimeout(() => r(null), ms));
    const ulkeAdi = (kod, yedek) => {
      try { return (kod && new Intl.DisplayNames(["tr"], { type: "region" }).of(kod.toUpperCase())) || yedek || ""; }
      catch (e) { return yedek || ""; }
    };
    const kaynaklar = [
      async () => { const d = await (await fetch("https://get.geojs.io/v1/ip/geo.json")).json();
        return { sehir: d.city, bolge: d.region, kod: d.country_code, ulke: d.country, kurum: d.organization_name || d.organization }; },
      async () => { const d = await (await fetch("https://ipapi.co/json/")).json();
        return { sehir: d.city, bolge: d.region, kod: d.country_code, ulke: d.country_name, kurum: d.org }; }
    ];
    for (const k of kaynaklar) {
      try {
        const d = await Promise.race([k(), zamanAsimi(2500)]);
        if (d && (d.kod || d.ulke)) {
          if (d.kurum && ROBOT_KURUM.test(d.kurum)) robot = true;
          const parca = [d.sehir];
          const sade = (x) => String(x || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/ı/g, "i");
          if (d.bolge && !(d.sehir && sade(d.bolge).includes(sade(d.sehir)))) parca.push(d.bolge);
          parca.push(ulkeAdi(d.kod, d.ulke));
          konumIp = parca.filter(Boolean).join(", ");
          return konumIp;
        }
      } catch (e) {}
    }
    return "";
  })();
  const kisaKonum = () => konumIp ? konumIp.split(", ").filter((_, i, a) => i === 0 || i === a.length - 1).join(", ") : ulke.split(" (")[0];
  const konumSatiri = () => konumIp ? "Konum: " + konumIp + " (saat dilimi: " + (saatDilimi || "?") + ")"
                                    : "Konum (saat dilimine göre): " + (ulke || "bilinmiyor");
  const cihaz = (() => {
    const u = navigator.userAgent;
    let c = /iPhone/.test(u) ? "iPhone" : /iPad/.test(u) ? "iPad" : /Android/.test(u) ? "Android" : /Mac OS X/.test(u) ? "Mac" : /Windows/.test(u) ? "Windows" : "Diğer";
    const uyg = /TikTok|musical_ly|BytedanceWebview/i.test(u) ? " · TikTok içinden" : /Instagram/i.test(u) ? " · Instagram içinden" : /FBAN|FBAV/i.test(u) ? " · Facebook içinden" : "";
    return c + uyg;
  })();
  const saat = new Date(giris).toLocaleString("tr-TR", { timeZone: "Europe/Stockholm", dateStyle: "short", timeStyle: "short" });

  const kacir = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  function gonder(veri) {
    if (ben || !AYAR.bildirimAdresi) return;
    if (robot && !AYAR.robotlariBildir) return;
    veri.html = veri.metin.split("\n").map(kacir).join("<br>");
    const govde = new URLSearchParams(veri);
    try {
      if (navigator.sendBeacon && navigator.sendBeacon(AYAR.bildirimAdresi, govde)) return;
    } catch (e) {}
    try { fetch(AYAR.bildirimAdresi, { method: "POST", body: govde, mode: "no-cors", keepalive: true }); } catch (e) {}
  }
  function umami(olay, veri) {
    if (ben || !window.umami) return;
    try { window.umami.track(olay, veri); } catch (e) {}
  }
  const ortak = () => ({ saat, kaynak, ulke, cihaz, dil: navigator.language || "", ziyaret_no: String(ziyaretNo),
    ziyaretci: ziyaretNo > 1 ? ziyaretNo + ". gelişi" : "İlk kez geliyor" });

  async function geldi() {
    await konumHazir;
    const o = ortak();
    const kk = kisaKonum();
    gonder({ ...o, olay: "geldi", konum: konumIp,
      baslik: "Siteye biri geldi: " + o.kaynak + (kk ? ", " + kk : ""),
      metin: ["Saat: " + o.saat, "Nereden geldi: " + o.kaynak, konumSatiri(),
              "Cihaz: " + o.cihaz, "Dil: " + o.dil, "Ziyaret: " + o.ziyaretci].join("\n") });
  }
  function ozet() {
    const sure = Math.round((Date.now() - giris) / 1000);
    const dinledi = Object.entries(dinlenen).map(([a, s]) => a + " (" + sureYaz(s) + ")");
    const durum = sure + "|" + dinledi.join() + "|" + gidilen.join();
    if (ozetSayisi >= 2 || durum === sonOzet || sure < 3) return;
    ozetSayisi++; sonOzet = durum;
    const o = ortak();
    gonder({ ...o, olay: "ozet", konum: konumIp, kalis: sureYaz(sure), dinledigi: dinledi.join(", "), gittigi: gidilen.join(", "),
      baslik: "Ziyaret özeti: " + sureYaz(sure) + " kaldı" + (gidilen.length ? ", gittiği yer: " + gidilen[0].split(" (")[0] : ""),
      metin: ["Kaldığı süre: " + sureYaz(sure),
              "Dinlediği şarkılar: " + (dinledi.join(", ") || "yok"),
              "Gittiği hesaplar: " + (gidilen.join(", ") || "yok"),
              "Nereden geldi: " + o.kaynak, konumSatiri(),
              "Cihaz: " + o.cihaz, "Geliş saati: " + o.saat, "Ziyaret: " + o.ziyaretci].join("\n") });
  }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") ozet(); });
  addEventListener("pagehide", ozet);

  return {
    baslat() {
      geldi();
      if (AYAR.umamiKimlik && !ben) {
        const s = document.createElement("script");
        s.defer = true; s.src = "https://cloud.umami.is/script.js"; s.dataset.websiteId = AYAR.umamiKimlik;
        document.head.appendChild(s);
      }
    },
    dinledi(ad, sn) { dinlenen[ad] = Math.max(dinlenen[ad] || 0, Math.round(sn)); },
    onizleme(olay, ad) { umami(olay, { sarki: ad }); },
    gitti(platform, nereden) {
      gidilen.push(PLATFORM_ADI[platform] + " (" + nereden + ")");
      umami("platforma-gitti", { platform: PLATFORM_ADI[platform], nereden });
    }
  };
})();

/* ---------------- Sayfa ---------------- */
const hesapNav = $("#hesaplar");
for (const p of ["spotify", "youtubeMuzik", "youtube", "tiktok", "instagram"]) {
  const url = AYAR.hesaplar[p];
  if (!url) continue;
  const a = document.createElement("a");
  a.href = url; a.target = "_blank"; a.rel = "noopener"; a.innerHTML = SIMGE[p];
  a.setAttribute("aria-label", PLATFORM_ADI[p]);
  a.addEventListener("click", () => Ziyaret.gitti(p, "ana sayfa"));
  hesapNav.appendChild(a);
}

const liste = $("#liste");
SARKILAR.forEach((s, i) => {
  const li = document.createElement("li");
  li.innerHTML = '<button class="sarki" type="button">' +
    '<img src="medya/kapak/' + s.id + '.jpg" alt="" loading="lazy" width="48" height="64">' +
    '<span class="baslik"></span><span class="ikon">' + SIMGE.oynat + '</span><i class="izi"></i></button>';
  li.querySelector(".baslik").textContent = s.ad;
  li.querySelector("button").addEventListener("click", () => cal(i));
  liste.appendChild(li);
});

/* ---------------- Çalar ---------------- */
const calar = $("#calar"), tuval = $("#tuval"), ses = new Audio();
ses.preload = "none";
let sira = -1, sinir = AYAR.onizlemeSn, bitti = false, sonOdak = null;

function oynatSimgesi() {
  const calıyor = !ses.paused;
  $("#oynat").innerHTML = calıyor ? SIMGE.durdur : SIMGE.oynat;
  $("#oynat").setAttribute("aria-label", calıyor ? "Duraklat" : "Oynat");
}
function platformlariDoldur(s) {
  const kutu = $("#platformlar");
  kutu.innerHTML = "";
  for (const p of ["spotify", "youtubeMuzik", "youtube"]) {
    const a = document.createElement("a");
    a.href = sarkiBaglantisi(s, p); a.target = "_blank"; a.rel = "noopener";
    const kisa = p === "youtubeMuzik" ? "YT Music" : PLATFORM_ADI[p];
    a.innerHTML = SIMGE[p] + '<span class="kisa">' + kisa + '</span><span class="uzun">' + PLATFORM_ADI[p] + "</span>";
    a.addEventListener("click", () => Ziyaret.gitti(p, s.ad));
    kutu.appendChild(a);
  }
}
function cal(i) {
  if (sira < 0) sonOdak = document.activeElement;
  sira = (i + SARKILAR.length) % SARKILAR.length;
  const s = SARKILAR[sira];
  bitti = false;
  calar.classList.remove("bitti");
  $("#devam-yazi").textContent = "Tamamını dinle";
  $("#calar-baslik").textContent = s.ad;
  platformlariDoldur(s);
  document.querySelectorAll(".sarki").forEach((b, k) => b.setAttribute("aria-current", k === sira ? "true" : "false"));

  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  tuval.poster = "medya/kapak/" + s.id + ".jpg";
  tuval.src = reduce ? "" : "medya/video/" + s.id + ".mp4";
  if (!reduce) tuval.play().catch(() => {});

  ses.src = s.ses || "medya/ses/" + s.id + ".m4a";
  ses.currentTime = 0;
  ses.play().then(oynatSimgesi).catch(oynatSimgesi);
  Ziyaret.onizleme("onizleme-basladi", s.ad);

  if (!calar.classList.contains("acik")) {
    calar.hidden = false;
    calar.classList.add("acik");
    document.body.style.overflow = "hidden";
    $("#kapat").focus();
  }
  if ("mediaSession" in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({ title: s.ad, artist: "HasanCa",
      artwork: [{ src: new URL("medya/kapak/" + s.id + ".jpg", location.href).href, sizes: "360x640", type: "image/jpeg" }] });
    navigator.mediaSession.setActionHandler("nexttrack", () => cal(sira + 1));
    navigator.mediaSession.setActionHandler("previoustrack", () => cal(sira - 1));
  }
  guncelle();
}
function baslangic() { return SARKILAR[sira].baslangic || 0; }
function toplamSure() {
  const kalan = isFinite(ses.duration) ? ses.duration - baslangic() : sinir;
  return Math.min(sinir, kalan);
}
function guncelle() {
  if (sira < 0) return;
  const gecen = Math.max(0, ses.currentTime - baslangic()), toplam = toplamSure();
  $("#ilerleme").style.width = Math.min(100, (gecen / toplam) * 100) + "%";
  $("#gecen").textContent = sureYaz(gecen);
  $("#toplam").textContent = sureYaz(toplam);
  const iz = document.querySelectorAll(".sarki .izi")[sira];
  if (iz) iz.style.transform = "scaleX(" + Math.min(1, gecen / toplam) + ")";
  Ziyaret.dinledi(SARKILAR[sira].ad, gecen);
  if (!bitti && gecen >= toplam - 0.05 && ses.currentTime > 0) onizlemeBitti();
}
function onizlemeBitti() {
  if (bitti) return;
  bitti = true;
  ses.pause();
  oynatSimgesi();
  calar.classList.add("bitti");
  $("#devam-yazi").textContent = "Devamını nerede dinlemek istersin?";
  Ziyaret.onizleme("onizleme-bitti", SARKILAR[sira].ad);
}
function kapat() {
  ses.pause();
  tuval.pause();
  calar.classList.remove("acik", "bitti");
  calar.hidden = true;
  document.body.style.overflow = "";
  if (sonOdak) sonOdak.focus();
  sira = -1;
  document.querySelectorAll(".sarki").forEach((b) => b.setAttribute("aria-current", "false"));
}

ses.addEventListener("loadedmetadata", () => { if (baslangic()) ses.currentTime = baslangic(); guncelle(); });
ses.addEventListener("timeupdate", guncelle);
ses.addEventListener("ended", onizlemeBitti);
ses.addEventListener("play", oynatSimgesi);
ses.addEventListener("pause", oynatSimgesi);

$("#oynat").addEventListener("click", () => { if (ses.paused) ses.play().catch(() => {}); else ses.pause(); });
$("#onceki").addEventListener("click", () => cal(sira - 1));
$("#sonraki").addEventListener("click", () => cal(sira + 1));
$("#sonra").addEventListener("click", () => cal(sira + 1));
$("#kapat").addEventListener("click", kapat);
document.addEventListener("keydown", (e) => {
  if (calar.hidden) return;
  if (e.key === "Escape") kapat();
  if (e.key === " " && e.target === document.body) { e.preventDefault(); $("#oynat").click(); }
});
$("#basla").addEventListener("click", () => {
  const i = SARKILAR.findIndex((s) => s.id === AYAR.oneCikan);
  cal(i < 0 ? 0 : i);
});

Ziyaret.baslat();
</script>
</body>
</html>
